bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 20
    default_behavior_tree: "navigate_w_replanning_bt.xml"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.6 
      yaw_goal_tolerance: 0.35

    # --- CONFIGURAÇÃO MPPI (Corrigida e Indentada) ---
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 25
      model_dt: 0.1
      batch_size: 1000
      vx_std: 0.40
      vy_std: 0.25
      wz_std: 0.45
      vx_max: 4.0
      vx_min: 0.0
      wz_max: 0.6
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1

      visualize: true
      trajectory_step: 5

      motion_model: "Ackermann"
      Ackermann:
        min_turning_r: 2.0

      # ---------------------------------------------------------
      # MUDANÇA AQUI: Usando os nomes completos na lista (IDs)
      # ---------------------------------------------------------
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PreferForwardCritic"]

      # Agora configuramos cada bloco com o NOME NOVO, mas mantemos o plugin explícito

      ConstraintCritic:
        plugin: "nav2_mppi_controller::critics::ConstraintCritic" 
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic: # Era 'Obstacles', agora 'ObstaclesCritic'
        plugin: "nav2_mppi_controller::critics::ObstaclesCritic"
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        repulsion_weight: 1.5
        collision_cost: 1000.0

      GoalCritic:
        plugin: "nav2_mppi_controller::critics::GoalCritic"
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.4

      PathAlignCritic:
        plugin: "nav2_mppi_controller::critics::PathAlignCritic"
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5

      PathFollowCritic:
        plugin: "nav2_mppi_controller::critics::PathFollowCritic"
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PreferForwardCritic:
        plugin: "nav2_mppi_controller::critics::PreferForwardCritic"
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[2.0, -0.6], [-0.3, -0.6], [-0.3, 0.6], [2.0, 0.6]]"
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: velodyne
        velodyne:
          topic: "/velodyne_points"
          sensor_frame: "velodyne"
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 5.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      footprint: "[[2.0, -0.6], [-0.2, -0.6], [-0.2, 0.6], [2.0, 0.6]]"
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_link"
      
      # --- MUDANÇA PARA SLAM: Mapa estático, não rolling ---
      rolling_window: false 
      resolution: 0.1
      robot_radius: 0.22
      track_unknown_space: false
      
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True 
        enabled: true
        subscribe_to_updates: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 3.0


map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      ## Mundo grande → permitir desconhecido
      allow_unknown: true
      tolerance: 0.5

      ## Performance
      max_planning_time: 1.5
      max_iterations: 300000
      max_on_approach_iterations: 300

      ## Cinemática
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 2.0

      ## Menos estados = mais rápido e suave
      angle_quantization_bins: 48

      ## Analytic expansion menos agressivo
      analytic_expansion_ratio: 2.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0

      ## Custo de obstáculo
      cost_penalty: 3.5
      non_straight_penalty: 1.3

      ## Penalidades secundárias
      reverse_penalty: 5.0
      change_penalty: 1.0

      ## Heurística
      downsample_obstacle_heuristic: true
      lookup_table_size: 15.0

      ## Suavização simples (não pesada)
      smooth_path: true
      smoother:
        max_iterations: 300
        w_smooth: 0.25
        w_data: 0.3
        tolerance: 1e-6
        do_refinement: false

      goal_heading_mode: "DEFAULT"
      coarse_search_resolution: 4


recovery_server:
  ros__parameters:
    use_sim_time: True
    recovery_behaviors: ["back_up"]
    back_up:
      plugin: "nav2_behaviors::BackUp"
      backup_distance: 0.2
      backup_time: 3.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200